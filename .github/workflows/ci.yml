name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_codeguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_codeguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_codeguard?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      # High and critical advisories fail this job. Moderate and low findings
      # are still printed. Do not lower this level to hide them.
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run prisma:generate --workspace=backend
      - run: npm run prisma:validate --workspace=backend
      - run: npm run prisma:deploy --workspace=backend
      - run: npm run lint
      - run: npm run type-check
      - run: npm run type-check:e2e --workspace=frontend
      - run: npm test
      - run: npm test --workspace=frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=frontend
      - run: npm run build
      - run: docker build --file backend/Dockerfile --tag ai-codeguard-backend:ci .
      - run: docker build --file backend/Dockerfile.runner --tag ai-codeguard-runner:ci .
      - run: docker build --file frontend/Dockerfile --tag ai-codeguard-frontend:ci .
