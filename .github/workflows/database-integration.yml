name: Database integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_codeguard_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_codeguard_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_codeguard_integration_test?schema=public
      INTEGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_codeguard_integration_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npm run deploy:check --workspace=backend
      - run: npm run prisma:generate --workspace=backend
      - run: npm run prisma:deploy --workspace=backend
      - run: npm run test:database --workspace=backend
