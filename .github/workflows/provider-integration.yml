name: Provider integration

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  providers:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_PROVIDER_INTEGRATION_TESTS == 'true'
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
    env:
      SMTP_INTEGRATION_HOST: 127.0.0.1
      SMTP_INTEGRATION_PORT: 1025
      SMTP_INTEGRATION_API_URL: http://127.0.0.1:8025
      RUN_GITHUB_INTEGRATION_TEST: ${{ secrets.GITHUB_INTEGRATION_TOKEN != '' && '1' || '0' }}
      GITHUB_INTEGRATION_TOKEN: ${{ secrets.GITHUB_INTEGRATION_TOKEN }}
      GITHUB_INTEGRATION_OWNER: ${{ secrets.GITHUB_INTEGRATION_OWNER }}
      GITHUB_INTEGRATION_REPO: ${{ secrets.GITHUB_INTEGRATION_REPO }}
      RUN_OPENAI_INTEGRATION_TEST: ${{ secrets.OPENAI_INTEGRATION_API_KEY != '' && '1' || '0' }}
      OPENAI_INTEGRATION_API_KEY: ${{ secrets.OPENAI_INTEGRATION_API_KEY }}
      RUN_STRIPE_INTEGRATION_TEST: ${{ secrets.STRIPE_INTEGRATION_SECRET_KEY != '' && '1' || '0' }}
      STRIPE_INTEGRATION_SECRET_KEY: ${{ secrets.STRIPE_INTEGRATION_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - name: Wait for Mailpit
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8025/api/v1/info; then
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit did not become ready" >&2
          exit 1
      - name: External provider tests
        run: npm run test:providers --workspace=backend
